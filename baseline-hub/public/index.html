<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Welcome, tennis addict — Baseline Studio & Baseline Club." />
    <title>Baseline — tennis addict HQ</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div class="tennis-stage" aria-hidden="true">
          <div class="doodle-scene">
            <span class="doodle-spark doodle-spark--1">pop!</span>
            <span class="doodle-spark doodle-spark--2">love</span>
            <span class="doodle-spark doodle-spark--3">spin</span>
            <svg class="doodle-racket" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="26" cy="24" rx="18" ry="20" stroke="#2c5530" stroke-width="2.5" />
              <line x1="38" y1="38" x2="58" y2="58" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" />
            </svg>
            <img class="doodle-ball doodle-ball--a" src="assets/tennis-ball.svg" alt="" width="40" height="40" />
            <img class="doodle-ball doodle-ball--b" src="assets/tennis-ball.svg" alt="" width="32" height="32" />
          </div>
        </div>
        <p class="kicker">Chào hội nghiện tennis</p>
        <h1 class="title">Welcome, tennis addict.</h1>
        <p class="subtitle">
          Symptoms: phantom net cords, “one more set,” and racquets you absolutely need.
          Pick Studio or Club — we won’t judge your string obsession.
        </p>
      </header>

      <div class="cards">
        <article class="card card--stack">
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/studio-logo.jpg"
              alt="Baseline Studio"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Studio</span>
          <div class="card-links">
            <a
              class="card-cta"
              href="https://www.facebook.com/profile.php?id=61564808380011"
              target="_blank"
              rel="noopener noreferrer"
            >
              Facebook →
            </a>
          </div>
        </article>

        <article class="card card--stack">
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/club-logo.jpg"
              alt="Baseline Club"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Club</span>
          <div class="card-links">
            <a
              class="card-cta"
              href="http://14.225.212.3:3001/"
              rel="noopener noreferrer"
            >
              Website →
            </a>
            <a
              class="card-cta"
              href="https://www.facebook.com/profile.php?id=61592847184311"
              target="_blank"
              rel="noopener noreferrer"
            >
              Facebook →
            </a>
          </div>
        </article>
      </div>

    </main>
  </body>
</html>
