<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Welcome, tennis mate — Baseline Studio & Baseline Club." />
    <title>Baseline</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div class="tennis-stage" aria-hidden="true">
          <div class="doodle-scene">
            <img
              class="doodle-racket"
              src="assets/tennis-racket.svg"
              alt=""
              width="80"
              height="100"
            />
            <img class="doodle-ball doodle-ball--a" src="assets/tennis-ball.svg" alt="" width="44" height="44" />
            <img class="doodle-ball doodle-ball--b" src="assets/tennis-ball.svg" alt="" width="34" height="34" />
          </div>
        </div>
        <h1 class="title">Welcome, tennis mate.</h1>
        <p class="subtitle">
          Hãy ghé một trong các shop trong hệ sinh thái Baseline của chúng mình nhé.
        </p>
      </header>

      <div class="cards">
        <article class="card card--stack">
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/studio-logo.jpg"
              alt="Baseline Studio"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Studio</span>
          <div class="card-links">
            <a
              class="card-cta"
              href="https://www.facebook.com/profile.php?id=61564808380011"
              target="_blank"
              rel="noopener noreferrer"
            >
              Facebook →
            </a>
          </div>
        </article>

        <article class="card card--stack">
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/club-logo.jpg"
              alt="Baseline Club"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Club</span>
          <div class="card-links">
            <a
              class="card-cta"
              href="http://14.225.212.3:3001/"
              rel="noopener noreferrer"
            >
              Website →
            </a>
            <a
              class="card-cta"
              href="https://www.facebook.com/profile.php?id=61592847184311"
              target="_blank"
              rel="noopener noreferrer"
            >
              Facebook →
            </a>
          </div>
        </article>
      </div>

      <section class="qr-block" aria-labelledby="qr-heading">
        <h2 id="qr-heading" class="qr-title">Quét mã QR</h2>
        <p class="qr-hint">Mở link hub trên điện thoại — không cần gõ địa chỉ.</p>
        <img
          class="qr-image"
          src="assets/hub-qr.png"
          width="220"
          height="220"
          alt="QR code mở http://14.225.212.3:3002/"
        />
        <p class="qr-url">http://14.225.212.3:3002/</p>
      </section>
    </main>
  </body>
</html>
