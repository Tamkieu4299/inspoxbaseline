<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Baseline Studio & Baseline Club — website and Facebook." />
    <title>Baseline</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="kicker">Welcome</p>
        <h1 class="title">Baseline</h1>
        <p class="subtitle">Baseline Studio &amp; Baseline Club</p>
      </header>

      <div class="cards">
        <article class="card card--stack">
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/studio-logo.jpg"
              alt="Baseline Studio"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Studio</span>
          <div class="card-links">
            <a
              class="card-cta"
              href="https://www.facebook.com/profile.php?id=61564808380011"
              target="_blank"
              rel="noopener noreferrer"
            >
              Facebook →
            </a>
          </div>
        </article>

        <article class="card card--stack">
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/club-logo.jpg"
              alt="Baseline Club"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Club</span>
          <div class="card-links">
            <a
              class="card-cta"
              href="http://14.225.212.3:3001/"
              rel="noopener noreferrer"
            >
              Website →
            </a>
            <a
              class="card-cta"
              href="https://www.facebook.com/profile.php?id=61592847184311"
              target="_blank"
              rel="noopener noreferrer"
            >
              Facebook →
            </a>
          </div>
        </article>
      </div>

    </main>
  </body>
</html>
