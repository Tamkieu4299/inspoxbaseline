<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Baseline Studio & Baseline Club — follow us on Facebook." />
    <title>Baseline</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="kicker">Welcome</p>
        <h1 class="title">Baseline</h1>
        <p class="subtitle">Chọn trang Facebook của bạn · Choose your page</p>
      </header>

      <div class="cards">
        <a
          class="card"
          href="https://www.facebook.com/profile.php?id=61564808380011"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/studio-logo.svg"
              alt="Baseline Studio"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Studio</span>
          <span class="card-cta">Facebook →</span>
        </a>

        <a
          class="card"
          href="https://www.facebook.com/profile.php?id=61592847184311"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="logo-wrap">
            <img
              class="logo"
              src="assets/club-logo.svg"
              alt="Baseline Club"
              width="280"
              height="120"
            />
          </div>
          <span class="card-name">Baseline Club</span>
          <span class="card-cta">Facebook →</span>
        </a>
      </div>

    </main>
  </body>
</html>
