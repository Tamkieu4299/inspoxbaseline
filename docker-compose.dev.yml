# Development override — hot reload for the backend (volume-mounted, uvicorn --reload).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up minio backend
#
# For the frontend, run it on your host for instant hot updates:
#   cd frontend && npm install && npm run dev   # -> http://localhost:5173 (proxies /api -> localhost:8000)

services:
  backend:
    build: ./backend
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
